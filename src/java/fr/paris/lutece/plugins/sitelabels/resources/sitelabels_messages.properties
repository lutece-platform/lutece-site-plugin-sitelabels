# Site labels samples
# First define a group code, named "mylabelgroup" to group in a single block all "mylabel" site labels
site_property.mylabel.group=mylabelgroup
# Define a group title for the group "mylabelgroup" (the key is "site_property.<group_code>.group.title")
site_property.mylabelgroup.group.title=Sample Labels

# "label1" key 
# Add "label1" key to "mylabelgroup" group
site_property.mylabel.label1.group=mylabelgroup
# Key  "label1" value -> /!\ should be map with "sitelabels.site_property.mylabel.label1" in Lutece core core_datastore table
site_property.mylabel.label1=My Label 1 
# Help for key "label1"
site_property.mylabel.label1.help=Add a label 1 for me
# Key  "label1" order d'affichage dans la page des propriétés pour les clé du groupe "mylabelgroup"
site_property.mylabel.label1.order=1 

# Sample 2 : key "label2"
site_property.mylabel.label2.group=mylabelgroup
site_property.mylabel.label2=My Label 2
site_property.mylabel.label2.help=Add a label 2 for me
site_property.mylabel.label2.order=2